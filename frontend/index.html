  <head>

              'border-subtle': 'rgba(255, 255, 255, 0.08)',
              'on-background': '#d7e3fb',
              'on-surface': '#d7e3fb',

              'on-primary': '#1000a9',
              'on-primary-container': '#0d0096',

              primary: '#c0c1ff',
              'primary-container': '#8083ff',
              'primary-fixed': '#e1e0ff',
              'primary-fixed-dim': '#c0c1ff',
              'on-primary-fixed': '#07006c',
              'on-primary-fixed-variant': '#2f2ebe',
              secondary: '#89ceff',

            borderRadius: {
              DEFAULT: '0.125rem',

            spacing: {

              'stack-sm': '8px',

    </script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #081425;
        color: #d7e3fb;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
        vertical-align: middle;
      }
      .glass-panel {
        background: rgba(15, 28, 46, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .glass-bg {
        background: rgba(15, 28, 46, 0.7);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
      }
      .pro-card {
        background-color: #0f1c2e;
        border: 1px solid rgba(255, 255, 255, 0.08);
        transition: all 0.3s ease;
      }
      .pro-card:hover {
        border-color: rgba(255, 255, 255, 0.2);
        transform: translateY(-2px);
      }
      .mesh-gradient {
        background-color: #081425;
        background-image: radial-gradient(at 8% 87%, hsla(245, 67%, 58%, 0.15) 0px, transparent 50%),
          radial-gradient(at 93% 15%, hsla(200, 80%, 50%, 0.1) 0px, transparent 50%),
          radial-gradient(at 48% 66%, hsla(280, 60%, 50%, 0.08) 0px, transparent 50%);
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #081425;
      }
      ::-webkit-scrollbar-thumb {
        background: #2a3548;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #464554;
      }
      .step-active {
        border-color: #c0c1ff;
        color: #c0c1ff;
      }
      .step-completed {
        border-color: #10b981;
        color: #10b981;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fadeIn 0.4s ease-out forwards;
      }
      @keyframes scaleIn {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(8px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      .animate-scale-in {
        animation: scaleIn 0.25s ease-out forwards;
      }
      @keyframes shimmer {
        100% {
          transform: translateX(100%);
        }
      }
      .gauge-circle {
        transition: stroke-dashoffset 1s ease-out;
      }
      .input-glow:focus {
        box-shadow: 0 0 0 2px rgba(192, 193, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
